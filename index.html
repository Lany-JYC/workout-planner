<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 小可爱的运动计划</title>
<style>
  :root {
    --bg: #faf8fc;
    --card: #ffffff;
    --primary: #e85d75;
    --primary-light: #fce4e9;
    --accent: #7c5cbf;
    --accent-light: #ede4f7;
    --text: #2d2a3a;
    --text-muted: #8a8695;
    --border: #eceaf0;
    --success: #4caf93;
    --success-light: #e6f7f1;
    --warning: #f0a855;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(44,30,60,0.06);
    --shadow-lg: 0 8px 32px rgba(44,30,60,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #e85d75 0%, #c94b8c 50%, #7c5cbf 100%);
    color: #fff;
    padding: 28px 24px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 24px;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
  }
  .header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.02em; }
  .header .subtitle { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 16px 20px 0;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: transparent;
    border-radius: 12px 12px 0 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab.active {
    background: var(--card);
    color: var(--primary);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
  }
  .tab .icon { font-size: 1.1rem; }

  /* ===== MAIN CONTENT ===== */
  .main {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px 100px;
  }

  /* ===== STATS ROW ===== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .num {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* ===== WEEK GRID ===== */
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--primary);
    border-radius: 2px;
  }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .day-chip {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.72rem;
    position: relative;
  }
  .day-chip:hover { border-color: var(--primary-light); }
  .day-chip.active { border-color: var(--primary); background: var(--primary-light); }
  .day-chip.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .day-chip.checked { background: var(--success-light); border-color: var(--success); }
  .day-chip.checked::after {
    content: '✓';
    position: absolute;
    top: -6px;
    right: -4px;
    background: var(--success);
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .day-chip .day-name { font-weight: 600; display: block; }
  .day-chip .day-num { font-size: 1.1rem; font-weight: 700; display: block; margin: 2px 0; }

  /* ===== SELECTED DAY ===== */
  .selected-day-panel {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .selected-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .selected-day-header h3 { font-size: 1.15rem; }
  .btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #d44a63; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,93,117,0.35); }
  .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #3d9e7d; }
  .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
  .btn-danger { background: #fff; color: #e85d75; border: 1.5px solid #fccdd5; }
  .btn-danger:hover { background: #fff5f5; }

  /* ===== EXERCISE CARD ===== */
  .exercise-list { display: flex; flex-direction: column; gap: 10px; }
  .exercise-card {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .exercise-card.expanded { border-color: var(--primary-light); box-shadow: var(--shadow); }
  .exercise-card-header {
    display: flex;
    align-items: center;
    padding: 14px;
    cursor: pointer;
    gap: 12px;
  }
  .exercise-card-header:hover { background: #faf9fc; }
  .exercise-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .exercise-info { flex:1; min-width: 0; }
  .exercise-info .name { font-weight: 700; font-size: 0.95rem; }
  .exercise-info .meta { font-size: 0.78rem; color: var(--text-muted); }
  .exercise-arrow { color: var(--text-muted); transition: transform 0.2s; font-size: 0.8rem; }
  .exercise-card.expanded .exercise-arrow { transform: rotate(180deg); }
  .exercise-card-body { display: none; padding: 0 14px 16px; }
  .exercise-card.expanded .exercise-card-body { display: block; }

  /* ===== EXERCISE DETAILS ===== */
  .detail-block { margin-bottom: 12px; }
  .detail-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .detail-text { font-size: 0.88rem; color: var(--text); line-height: 1.7; }
  .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 8px;
    background: #f0eef4;
  }
  .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  .video-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    gap: 8px;
  }
  .video-placeholder .play-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .sets-reps { display: flex; gap: 8px; flex-wrap: wrap; }
  .sr-chip {
    background: var(--primary-light);
    color: var(--primary);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 20px 32px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { font-size: 1.15rem; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ===== PROGRESS ===== */
  .progress-bar-bg {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .history-date { font-weight: 700; font-size: 0.9rem; min-width: 60px; }
  .history-exercises { font-size: 0.82rem; color: var(--text-muted); flex:1; }
  .history-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--success-light);
    color: var(--success);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 420px) {
    .week-grid { gap: 3px; }
    .day-chip { padding: 8px 2px; font-size: 0.68rem; border-radius: 8px; }
    .stats-row { gap: 6px; }
    .stat-card { padding: 12px 8px; }
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>💪 小可爱的运动计划</h1>
  <div class="subtitle" id="headerDate">2026年7月 · 第5周</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('plan')"><span class="icon">📋</span> 训练计划</button>
  <button class="tab" onclick="switchTab('progress')"><span class="icon">📊</span> 打卡记录</button>
</div>

<div class="main">
  <!-- ===== TAB: PLAN ===== -->
  <div id="tab-plan">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="stat-streak">0</div>
        <div class="label">🔥 连续打卡</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-week">0/7</div>
        <div class="label">📅 本周完成</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-total">0</div>
        <div class="label">⭐ 总打卡数</div>
      </div>
    </div>

    <!-- Week selector -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div class="section-title" style="margin:0;">📅 本周计划</div>
      <button class="btn btn-outline btn-sm" onclick="resetWeek()">🔄 重置本周</button>
    </div>

    <!-- Day chips -->
    <div class="week-grid" id="weekGrid"></div>

    <!-- Selected day panel -->
    <div class="selected-day-panel" id="dayPanel">
      <div class="selected-day-header">
        <h3 id="dayPanelTitle">星期一</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="openAddExercise()">+ 添加动作</button>
          <button class="btn btn-success btn-sm" id="btnCheckin" onclick="checkinDay()">✅ 打卡</button>
        </div>
      </div>
      <div class="exercise-list" id="exerciseList"></div>
    </div>
  </div>

  <!-- ===== TAB: PROGRESS ===== -->
  <div id="tab-progress" style="display:none;">
    <div class="section-title">📊 本月进展</div>
    <div style="background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-weight:700;">本月完成率</span>
        <span style="font-weight:700;color:var(--primary);" id="monthRate">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="monthProgress" style="width:0%;"></div>
      </div>
      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;" id="monthDetail">已完成 0 天 / 共 31 天</div>
    </div>

    <div class="section-title">📝 打卡历史</div>
    <div id="historyList">
      <div class="empty-state">
        <div class="emoji">🏃‍♀️</div>
        <div>还没有打卡记录<br>开始你的第一次训练吧！</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== ADD/EDIT EXERCISE MODAL ===== -->
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">添加运动动作</h3>
    <div class="form-group">
      <label>动作名称</label>
      <input type="text" id="exName" placeholder="例如：深蹲">
    </div>
    <div class="form-group">
      <label>动作类型</label>
      <select id="exType">
        <option value="strength">🏋️ 力量训练</option>
        <option value="cardio">🏃 有氧运动</option>
        <option value="flexibility">🧘 柔韧拉伸</option>
        <option value="core">🎯 核心训练</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>组数</label>
        <input type="number" id="exSets" value="3" min="1" max="20">
      </div>
      <div class="form-group">
        <label>每组次数 / 时长</label>
        <input type="text" id="exReps" value="12" placeholder="12次 或 30秒">
      </div>
    </div>
    <div class="form-group">
      <label>动作详细讲解</label>
      <textarea id="exDesc" placeholder="描述动作要领、注意事项、呼吸节奏等..."></textarea>
    </div>
    <div class="form-group">
      <label>教学视频链接（YouTube / Bilibili）</label>
      <input type="text" id="exVideo" placeholder="粘贴视频嵌入链接或分享链接...">
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" onclick="saveExercise()" style="flex:1;">💾 保存动作</button>
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1;">取消</button>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const STORAGE_KEY = 'workout_planner_data';
const DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];

// Default exercises library with detailed descriptions
const DEFAULT_EXERCISES = {
  '深蹲': {
    type: 'strength', sets: 3, reps: '15次',
    desc: '【动作要领】\n1. 双脚与肩同宽，脚尖微微外展\n2. 背部挺直，核心收紧\n3. 下蹲时臀部向后坐，像坐在椅子上\n4. 大腿与地面平行时停止\n5. 脚跟发力站起\n\n【注意事项】\n⚠️ 膝盖不要超过脚尖过多\n⚠️ 背部不要弓起\n⚠️ 重心放在脚后跟\n\n【呼吸节奏】\n下蹲吸气，站起呼气',
    video: ''
  },
  '平板支撑': {
    type: 'core', sets: 3, reps: '30秒',
    desc: '【动作要领】\n1. 俯卧，手肘在肩膀正下方\n2. 脚尖着地，身体成一条直线\n3. 核心收紧，臀部不要塌陷或抬高\n4. 目视下方，颈部保持中立\n\n【注意事项】\n⚠️ 腰部不要下沉\n⚠️ 不要憋气\n\n【呼吸节奏】\n保持均匀深呼吸',
    video: ''
  },
  '臀桥': {
    type: 'strength', sets: 3, reps: '15次',
    desc: '【动作要领】\n1. 仰卧，双膝弯曲，双脚平放地面\n2. 手臂放在身体两侧\n3. 臀部发力向上抬起\n4. 在最高点夹紧臀部停留1-2秒\n5. 缓慢下放\n\n【注意事项】\n⚠️ 不要用腰部代偿\n⚠️ 下巴微收\n\n【呼吸节奏】\n抬起呼气，下放吸气',
    video: ''
  },
  '开合跳': {
    type: 'cardio', sets: 3, reps: '30秒',
    desc: '【动作要领】\n1. 站立，双脚并拢，手臂放在身体两侧\n2. 跳起同时双脚分开，双手在头顶击掌\n3. 再跳回起始位置\n4. 保持节奏均匀\n\n【注意事项】\n⚠️ 落地时膝盖微弯缓冲\n⚠️ 穿运动鞋，在平坦地面进行\n\n【呼吸节奏】\n保持自然呼吸，不要憋气',
    video: ''
  },
  '卷腹': {
    type: 'core', sets: 3, reps: '20次',
    desc: '【动作要领】\n1. 仰卧，双膝弯曲，双脚平放\n2. 双手轻放在耳侧（不要用力拉头部）\n3. 用腹部力量将上半身卷起\n4. 肩胛骨离开地面即可\n5. 缓慢下放\n\n【注意事项】\n⚠️ 不要用颈部发力\n⚠️ 下背部保持贴地\n\n【呼吸节奏】\n卷起呼气，下放吸气',
    video: ''
  },
  '弓步蹲': {
    type: 'strength', sets: 3, reps: '每侧12次',
    desc: '【动作要领】\n1. 站立，双脚与髋同宽\n2. 向前迈一大步\n3. 双膝弯曲至约90度\n4. 后膝接近地面但不触地\n5. 前脚发力推回起始位置\n\n【注意事项】\n⚠️ 前膝不要超过脚尖\n⚠️ 上身保持直立\n⚠️ 核心收紧保持平衡\n\n【呼吸节奏】\n下蹲吸气，推起呼气',
    video: ''
  },
  '拉伸放松': {
    type: 'flexibility', sets: 1, reps: '每个动作30秒',
    desc: '【动作要领】\n1. 选择需要放松的肌群\n2. 缓慢进入拉伸位置\n3. 感到轻微拉伸感即可，不要疼痛\n4. 保持姿势，不要弹震\n5. 每个部位保持20-30秒\n\n【常见拉伸】\n• 大腿前侧：站立拉脚踝\n• 大腿后侧：坐姿前屈\n• 背部：猫牛式\n• 肩部：交叉手臂拉伸\n\n【呼吸节奏】\n深呼吸，每次呼气时尝试再放松一点',
    video: ''
  }
};

// ===== STATE =====
let appData = loadData();
let selectedDay = DAY_KEYS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1]; // Default to today
let editingExercise = null;

function getDefaultData() {
  const data = {
    weeks: {},     // { '2026-W31': { mon: [...], tue: [...], ... } }
    checkins: {},  // { '2026-07-28': true }
    created: new Date().toISOString()
  };
  // Pre-fill this week with default exercises
  const weekKey = getCurrentWeekKey();
  data.weeks[weekKey] = {};
  DAY_KEYS.forEach((day, i) => {
    if (i < 5) { // Weekdays only
      data.weeks[weekKey][day] = [
        { name: '深蹲', ...DEFAULT_EXERCISES['深蹲'] },
        { name: '臀桥', ...DEFAULT_EXERCISES['臀桥'] },
        { name: '平板支撑', ...DEFAULT_EXERCISES['平板支撑'] },
      ];
    } else {
      data.weeks[weekKey][day] = [
        { name: '拉伸放松', ...DEFAULT_EXERCISES['拉伸放松'] },
      ];
    }
  });
  return data;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.weeks && data.checkins) return data;
    }
  } catch(e) {}
  return getDefaultData();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

function getCurrentWeekKey() {
  const now = new Date();
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const weekNum = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  return `${now.getFullYear()}-W${weekNum}`;
}

function getTodayKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function getWeekExercises() {
  const wk = getCurrentWeekKey();
  if (!appData.weeks[wk]) appData.weeks[wk] = {};
  return appData.weeks[wk];
}

// ===== RENDER =====
function renderAll() {
  renderWeekGrid();
  renderDayPanel();
  renderProgress();
  renderStats();
  updateHeader();
}

function updateHeader() {
  const now = new Date();
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const weekNum = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月 · 第${weekNum}周`;
}

function renderWeekGrid() {
  const grid = document.getElementById('weekGrid');
  const today = new Date().getDay();
  const todayIdx = today === 0 ? 6 : today - 1;
  const weekData = getWeekExercises();

  grid.innerHTML = DAY_KEYS.map((key, i) => {
    const exercises = weekData[key] || [];
    const hasContent = exercises.length > 0;
    const dateKey = getDateKeyForDay(i);
    const isChecked = !!appData.checkins[dateKey];
    let cls = 'day-chip';
    if (key === selectedDay) cls += ' active';
    if (i === todayIdx) cls += ' today';
    if (isChecked) cls += ' checked';
    return `<div class="${cls}" onclick="selectDay('${key}')">
      <span class="day-name">${DAY_NAMES[i]}</span>
      <span class="day-num">${hasContent ? exercises.length : '-'}</span>
      <span style="font-size:0.65rem;color:var(--text-muted);">${hasContent ? '个动作' : '休息'}</span>
    </div>`;
  }).join('');
}

function renderDayPanel() {
  const weekData = getWeekExercises();
  const exercises = weekData[selectedDay] || [];
  const dayName = DAY_NAMES[DAY_KEYS.indexOf(selectedDay)];
  const dateKey = getDateKeyForSelected();
  const isChecked = !!appData.checkins[dateKey];

  document.getElementById('dayPanelTitle').textContent = `${dayName} · 训练计划`;
  const btnCheckin = document.getElementById('btnCheckin');
  btnCheckin.textContent = isChecked ? '✅ 已打卡' : '✅ 打卡';
  btnCheckin.className = isChecked ? 'btn btn-sm' : 'btn btn-success btn-sm';
  btnCheckin.style.cssText = isChecked
    ? 'background:#e6f7f1;color:#4caf93;cursor:default;'
    : '';

  const list = document.getElementById('exerciseList');
  if (exercises.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="emoji">🏖️</div>
      <div>今天是休息日~</div>
      <div style="font-size:0.8rem;">或者点击上方按钮添加训练动作</div>
    </div>`;
    return;
  }

  list.innerHTML = exercises.map((ex, idx) => {
    const typeIcons = { strength: '🏋️', cardio: '🏃', flexibility: '🧘', core: '🎯' };
    const typeColors = { strength: '#fce4e9', cardio: '#fff3e0', flexibility: '#ede4f7', core: '#e3f2fd' };
    const icon = typeIcons[ex.type] || '💪';
    const bg = typeColors[ex.type] || '#fce4e9';
    const videoHtml = ex.video
      ? `<div class="detail-block">
          <div class="detail-label">🎬 教学视频</div>
          <div class="video-wrapper">${parseVideoEmbed(ex.video)}</div>
        </div>`
      : `<div class="detail-block">
          <div class="detail-label">🎬 教学视频</div>
          <div class="video-wrapper">
            <div class="video-placeholder">
              <div class="play-icon">📹</div>
              <span>暂无视频，点击编辑添加</span>
            </div>
          </div>
        </div>`;

    return `<div class="exercise-card" id="ex-card-${idx}">
      <div class="exercise-card-header" onclick="toggleExercise(${idx})">
        <div class="exercise-icon" style="background:${bg};">${icon}</div>
        <div class="exercise-info">
          <div class="name">${escapeHtml(ex.name)}</div>
          <div class="meta">${ex.sets}组 × ${ex.reps}</div>
        </div>
        <span class="exercise-arrow">▼</span>
      </div>
      <div class="exercise-card-body">
        <div class="detail-block">
          <div class="detail-label">📐 组数 & 次数</div>
          <div class="sets-reps">
            <span class="sr-chip">${ex.sets} 组</span>
            <span class="sr-chip">${ex.reps}</span>
          </div>
        </div>
        <div class="detail-block">
          <div class="detail-label">📖 动作详解</div>
          <div class="detail-text">${escapeHtml(ex.desc || '暂无详细讲解').replace(/\n/g, '<br>')}</div>
        </div>
        ${videoHtml}
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();editExercise(${idx})">✏️ 编辑</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();removeExercise(${idx})">🗑️ 删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderStats() {
  const todayKey = getTodayKey();
  const weekData = getWeekExercises();

  // Count checkins this week
  let weekChecked = 0;
  DAY_KEYS.forEach((day, i) => {
    const dk = getDateKeyForDay(i);
    if (appData.checkins[dk]) weekChecked++;
  });

  // Total checkins
  const totalCheckins = Object.keys(appData.checkins).length;

  // Streak
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (appData.checkins[key]) streak++;
    else break;
  }

  document.getElementById('stat-streak').textContent = streak;
  document.getElementById('stat-week').textContent = `${weekChecked}/7`;
  document.getElementById('stat-total').textContent = totalCheckins;
}

function renderProgress() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let checkedInMonth = 0;

  const historyItems = [];
  const allDates = Object.keys(appData.checkins).sort().reverse();

  for (const dk of allDates) {
    const [y, m] = dk.split('-').map(Number);
    if (y === year && m === month + 1) checkedInMonth++;
    if (historyItems.length < 30) {
      historyItems.push(dk);
    }
  }

  const rate = daysInMonth > 0 ? Math.round((checkedInMonth / daysInMonth) * 100) : 0;
  document.getElementById('monthRate').textContent = rate + '%';
  document.getElementById('monthProgress').style.width = rate + '%';
  document.getElementById('monthDetail').textContent = `已完成 ${checkedInMonth} 天 / 共 ${daysInMonth} 天`;

  const histList = document.getElementById('historyList');
  if (historyItems.length === 0) {
    histList.innerHTML = `<div class="empty-state">
      <div class="emoji">🏃‍♀️</div>
      <div>还没有打卡记录<br>开始你的第一次训练吧！</div>
    </div>`;
    return;
  }

  histList.innerHTML = historyItems.map(dk => {
    const [y, m, d] = dk.split('-').map(Number);
    const date = new Date(y, m-1, d);
    const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
    const dayName = dayNames[date.getDay()];
    return `<div class="history-item">
      <div class="history-date">${m}/${d}<br><small>${dayName}</small></div>
      <div class="history-exercises">完成训练计划</div>
      <div class="history-badge">✅ 已打卡</div>
    </div>`;
  }).join('');
}

// ===== HELPERS =====
function getDateKeyForDay(dayIndex) {
  const now = new Date();
  const currentDay = now.getDay();
  const mondayOffset = currentDay === 0 ? -6 : 1 - currentDay;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  const target = new Date(monday);
  target.setDate(monday.getDate() + dayIndex);
  return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
}

function getDateKeyForSelected() {
  return getDateKeyForDay(DAY_KEYS.indexOf(selectedDay));
}

function parseVideoEmbed(url) {
  if (!url) return '';
  // YouTube
  let match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
  if (match) {
    return `<iframe src="https://www.youtube.com/embed/${match[1]}" allowfullscreen></iframe>`;
  }
  // Bilibili
  match = url.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
  if (match) {
    return `<iframe src="https://player.bilibili.com/player.html?bvid=${match[1]}&page=1" allowfullscreen></iframe>`;
  }
  // Bilibili short
  match = url.match(/b23\.tv\/([a-zA-Z0-9]+)/);
  if (match) {
    return `<div style="text-align:center;padding:12px;color:var(--text-muted);">🔗 B站短链接请在浏览器中打开：<br><a href="${escapeHtml(url)}" target="_blank">${escapeHtml(url)}</a></div>`;
  }
  // Generic embed (iframe code)
  if (url.includes('<iframe')) return url;
  // Unknown — show link
  return `<div style="text-align:center;padding:12px;color:var(--text-muted);">🔗 <a href="${escapeHtml(url)}" target="_blank">点击查看视频</a></div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== ACTIONS =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => {
    if (t.textContent.includes(tab === 'plan' ? '训练计划' : '打卡记录')) t.classList.add('active');
  });
  document.getElementById('tab-plan').style.display = tab === 'plan' ? 'block' : 'none';
  document.getElementById('tab-progress').style.display = tab === 'progress' ? 'block' : 'none';
  if (tab === 'progress') renderProgress();
}

function selectDay(dayKey) {
  selectedDay = dayKey;
  renderAll();
}

function toggleExercise(idx) {
  const card = document.getElementById('ex-card-' + idx);
  if (card) card.classList.toggle('expanded');
}

function openAddExercise() {
  editingExercise = null;
  document.getElementById('modalTitle').textContent = '添加运动动作';
  document.getElementById('exName').value = '';
  document.getElementById('exType').value = 'strength';
  document.getElementById('exSets').value = 3;
  document.getElementById('exReps').value = '12次';
  document.getElementById('exDesc').value = '';
  document.getElementById('exVideo').value = '';
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('exName').focus();
}

function editExercise(idx) {
  const weekData = getWeekExercises();
  const ex = weekData[selectedDay][idx];
  editingExercise = idx;
  document.getElementById('modalTitle').textContent = '编辑运动动作';
  document.getElementById('exName').value = ex.name;
  document.getElementById('exType').value = ex.type || 'strength';
  document.getElementById('exSets').value = ex.sets;
  document.getElementById('exReps').value = ex.reps;
  document.getElementById('exDesc').value = ex.desc || '';
  document.getElementById('exVideo').value = ex.video || '';
  document.getElementById('modalOverlay').style.display = 'flex';
}

function saveExercise() {
  const name = document.getElementById('exName').value.trim();
  if (!name) { alert('请输入动作名称'); return; }

  const exercise = {
    name,
    type: document.getElementById('exType').value,
    sets: parseInt(document.getElementById('exSets').value) || 3,
    reps: document.getElementById('exReps').value.trim() || '12次',
    desc: document.getElementById('exDesc').value.trim(),
    video: document.getElementById('exVideo').value.trim(),
  };

  const weekData = getWeekExercises();
  if (!weekData[selectedDay]) weekData[selectedDay] = [];

  if (editingExercise !== null) {
    weekData[selectedDay][editingExercise] = exercise;
  } else {
    weekData[selectedDay].push(exercise);
  }

  saveData();
  closeModal();
  renderAll();
}

function removeExercise(idx) {
  if (!confirm('确定要删除这个动作吗？')) return;
  const weekData = getWeekExercises();
  weekData[selectedDay].splice(idx, 1);
  saveData();
  renderAll();
}

function checkinDay() {
  const dateKey = getDateKeyForSelected();
  const weekData = getWeekExercises();
  const exercises = weekData[selectedDay] || [];

  if (exercises.length === 0) {
    alert('今天没有训练计划，休息也是训练的一部分哦~ 🏖️');
    return;
  }

  if (appData.checkins[dateKey]) {
    // Already checked in — ask to undo
    if (confirm('今天已经打卡了，要取消打卡吗？')) {
      delete appData.checkins[dateKey];
      saveData();
      renderAll();
    }
    return;
  }

  if (confirm(`确认完成"${DAY_NAMES[DAY_KEYS.indexOf(selectedDay)]}"的训练计划？\n${exercises.length}个动作等着你！💪`)) {
    appData.checkins[dateKey] = true;
    saveData();
    renderAll();
    // Animate
    const panel = document.getElementById('dayPanel');
    panel.style.transform = 'scale(1.02)';
    setTimeout(() => { panel.style.transform = ''; }, 200);
  }
}

function resetWeek() {
  if (confirm('确定要重置本周所有训练计划吗？（打卡记录不会清除）')) {
    const wk = getCurrentWeekKey();
    appData.weeks[wk] = {};
    DAY_KEYS.forEach((day, i) => {
      if (i < 5) {
        appData.weeks[wk][day] = [
          { name: '深蹲', ...DEFAULT_EXERCISES['深蹲'] },
          { name: '臀桥', ...DEFAULT_EXERCISES['臀桥'] },
          { name: '平板支撑', ...DEFAULT_EXERCISES['平板支撑'] },
        ];
      } else {
        appData.weeks[wk][day] = [
          { name: '拉伸放松', ...DEFAULT_EXERCISES['拉伸放松'] },
        ];
      }
    });
    saveData();
    renderAll();
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
  editingExercise = null;
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').style.display = 'none';
    editingExercise = null;
  }
});

// ===== INIT =====
renderAll();
</script>
</body>
</html>
